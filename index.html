 {const tx=AW*TS<VW?(AW*TS-VW)/2:clamp(P.x-VW/2,0,AW*TS-VW),ty=AH*TS<VH?(AH*TS-VH)/2:clamp(P.y-VH/2,0,AH*TS-VH);
